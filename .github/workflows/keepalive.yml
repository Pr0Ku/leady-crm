name: Supabase keep-alive

# Uruchamia się automatycznie co 3 dni i wykonuje lekkie zapytanie do bazy,
# żeby Supabase (darmowy plan) nie uśpił projektu po 7 dniach bezczynności.
# Można też odpalić ręcznie z zakładki "Actions" w GitHubie (workflow_dispatch).

on:
  schedule:
    - cron: "0 6 */3 * *"   # co 3 dni o 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Odpytaj Supabase
        run: |
          curl -sS -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/leady?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "Status odpowiedzi: %{http_code}\n"
          # Nowy format kluczy Supabase (sb_publishable_...) wysyłamy
          # wyłącznie w nagłówku "apikey" - w przeciwieństwie do starych
          # kluczy JWT, nie należy ich dodatkowo wysyłać jako
          # "Authorization: Bearer".
