name: Supabase keep-alive (test)

# Uruchamia się automatycznie co 3 dni i wykonuje lekkie zapytanie do bazy
# TESTOWEJ (leady-crm-test), żeby Supabase (darmowy plan) nie uśpił projektu
# po 7 dniach bezczynności. Godzina przesunięta względem wersji produkcyjnej,
# żeby oba joby nie odpalały się w tym samym momencie.
# Można też odpalić ręcznie z zakładki "Actions" w GitHubie (workflow_dispatch).

on:
  schedule:
    - cron: "0 12 */3 * *"   # co 3 dni o 12:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Odpytaj Supabase (test)
        run: |
          curl -sS -X GET \
            "${{ secrets.TEST_SUPABASE_URL }}/rest/v1/leady?select=id&limit=1" \
            -H "apikey: ${{ secrets.TEST_SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "Status odpowiedzi: %{http_code}\n"
          # Nowy format kluczy Supabase (sb_publishable_...) wysyłamy
          # wyłącznie w nagłówku "apikey" - w przeciwieństwie do starych
          # kluczy JWT, nie należy ich dodatkowo wysyłać jako
          # "Authorization: Bearer".
